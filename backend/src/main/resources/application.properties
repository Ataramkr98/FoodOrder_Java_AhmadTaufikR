# Bites API - Quarkus
# DevServices (Docker) disabled — we use real PostgreSQL on localhost
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bites
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key

# JWT (HS256 dev secret)
mp.jwt.verify.publickey.algorithm=HS256
mp.jwt.verify.publickey.location=keys/jwt-secret.txt
mp.jwt.verify.issuer=bites
smallrye.jwt.sign.key.location=keys/jwt-secret.txt
smallrye.jwt.sign.algorithm=HS256
smallrye.jwt.new-token.issuer=bites

quarkus.log.level=INFO
quarkus.log.category."com.bites".level=DEBUG
