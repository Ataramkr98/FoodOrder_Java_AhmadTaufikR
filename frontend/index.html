<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/bites-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bites — Platform Pemesanan Makanan Multi-Restoran</title>
  
  <!-- Google Fonts: Google Sans / Plus Jakarta Sans / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Global Google Sans Typography Stack */
    :root {
      --font-google-sans: 'Google Sans', 'Google Sans Text', 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body, html {
      font-family: var(--font-google-sans);
      letter-spacing: -0.01em;
    }

    /* Custom Leaflet Map Styles */
    .leaflet-container {
      font-family: var(--font-google-sans);
      z-index: 10;
    }
    .custom-courier-marker {
      background: none;
      border: none;
    }
    .courier-pin {
      width: 44px;
      height: 44px;
      background: #F97316;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
      font-size: 20px;
      transition: transform 0.3s ease-out;
    }
    .restaurant-pin {
      width: 40px;
      height: 40px;
      background: #0F172A;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3);
      font-size: 18px;
    }
    .customer-pin {
      width: 40px;
      height: 40px;
      background: #10B981;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
      font-size: 18px;
    }
    .pulse-ring {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(249, 115, 22, 0.2);
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      z-index: -1;
      top: -6px;
      left: -6px;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.7); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900 min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
